<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>High Volume Prototypes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      --ink: #1a1d26;
      --muted: #5c6378;
      --line: #e4e6ee;
      --paper: #f7f6f2;
      --panel: #ffffff;
      --accent: #2f5d50;
      --accent-soft: #e8f0ed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #dde8e4 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #f3e6dc 0%, transparent 50%),
        linear-gradient(180deg, var(--paper) 0%, #efece6 100%);
    }
    .wrap {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0 80px;
    }
    .brand {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(2.4rem, 5vw, 3.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 10px;
      line-height: 1.1;
    }
    .tagline {
      margin: 0 0 36px;
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 36em;
      line-height: 1.5;
    }
    .hint {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin: 0 0 28px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--panel) 85%, transparent);
      font-size: 0.92rem;
      color: var(--muted);
    }
    .hint span { display: inline-flex; align-items: center; gap: 8px; }
    .hint i { color: var(--accent); width: 1em; text-align: center; }

    .list {
      display: grid;
      gap: 12px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px 20px;
      align-items: center;
      padding: 18px 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: inherit;
    }
    .card h2 {
      margin: 0 0 4px;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .card h2 a {
      color: inherit;
      text-decoration: none;
    }
    .card h2 a:hover { color: var(--accent); }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .pill.is-draft {
      background: #f3efe8;
      color: #8a5a2b;
    }
    .links {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .links a,
    .links button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
      font-size: 0.95rem;
      font-family: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }
    .links a.secondary,
    .links button.secondary { color: var(--muted); font-weight: 600; }
    .links a:hover,
    .links button:hover { text-decoration: underline; }
    .links button.is-copied { color: var(--accent); }

    .card.is-group { grid-template-columns: 1fr; }
    .subs {
      display: grid;
      gap: 8px;
      list-style: none;
      margin: 16px 0 0;
      padding: 0;
    }
    .sub {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px 20px;
      align-items: center;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--paper) 55%, var(--panel));
    }
    .sub h3 {
      margin: 0 0 3px;
      font-size: 1rem;
      font-weight: 700;
    }
    .sub h3 a { color: inherit; text-decoration: none; }
    .sub h3 a:hover { color: var(--accent); }
    .sub p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .sub .meta { margin-top: 8px; }
    .empty, .err {
      padding: 28px 20px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }
    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer code {
      font-size: 0.85em;
      background: rgba(255,255,255,0.7);
      padding: 2px 6px;
      border-radius: 4px;
    }
    @media (max-width: 640px) {
      .wrap { width: calc(100% - 28px); padding-top: 36px; }
      .card { grid-template-columns: 1fr; }
      .sub { grid-template-columns: 1fr; }
      .links { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="brand" id="siteName">High Volume Prototypes</h1>
    <p class="tagline" id="siteTagline">Click a mock, share the link, leave feedback.</p>
    <div class="hint">
      <span><i class="fa-solid fa-link"></i> Share <strong>mock</strong> links with reviewers</span>
      <span><i class="fa-solid fa-lock"></i> Hub + threads stay internal</span>
      <span><i class="fa-regular fa-comment-dots"></i> Feedback is per prototype</span>
    </div>
    <div class="hint" id="hubShareRow" style="margin-top:-12px">
      <span><i class="fa-solid fa-share-nodes"></i> Internal hub link (team only)</span>
      <button type="button" id="shareHubBtn" class="secondary" style="margin-left:auto;font:600 0.92rem/1 inherit;border:0;background:none;color:var(--accent);cursor:pointer;padding:0">
        Copy hub link
      </button>
    </div>
    <ul class="list" id="mockList" aria-live="polite">
      <li class="empty">Loading mocks…</li>
    </ul>
    <footer>
      Add a file under <code>mocks/</code>, list it in <code>manifest.json</code>, push, done.
    </footer>
  </main>
  <script src="config.js"></script>
  <script src="shared/access.js"></script>
  <script src="shared/feedback-store.js"></script>
  <script>
    (function () {
      if (!window.PrototypesAccess.requireInternalAccess()) return;

      var cfg = window.PROTOTYPES_CONFIG || {};
      var store = window.PrototypesFeedbackStore;
      var access = window.PrototypesAccess;
      if (cfg.siteName) {
        document.getElementById('siteName').textContent = cfg.siteName;
        document.title = cfg.siteName;
      }
      if (cfg.siteTagline) {
        document.getElementById('siteTagline').textContent = cfg.siteTagline;
      }

      var clarityId = (cfg.clarityId || '').trim();
      if (clarityId) {
        (function (c, l, a, r, i, t, y) {
          c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
          t = l.createElement(r); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + i;
          y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, 'clarity', 'script', clarityId);
      }

      var list = document.getElementById('mockList');
      fetch('manifest.json', { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('manifest missing');
          return r.json();
        })
        .then(function (items) {
          if (!Array.isArray(items) || !items.length) {
            list.innerHTML = '<li class="empty">No mocks yet. Add one in <code>manifest.json</code>.</li>';
            return;
          }
          list.innerHTML = items.map(function (item) {
            return isGroup(item) ? groupMarkup(item) : cardMarkup(item);
          }).join('');

          prototypesOf(items).forEach(function (item) {
            store.count(item.id).then(function (result) {
              var el = document.querySelector('[data-count-for="' + cssEscape(item.id) + '"]');
              if (!el) return;
              var n = result.count || 0;
              el.textContent = n === 1 ? '1 comment' : n + ' comments';
            });
          });
        })
        .catch(function () {
          list.innerHTML = '<li class="err">Couldn’t load <code>manifest.json</code>. Serve this folder over HTTP (not as a file:// page).</li>';
        });

      list.addEventListener('click', function (e) {
        var btn = e.target.closest('.share-btn');
        if (!btn) return;
        e.preventDefault();
        sharePrototype(btn);
      });

      var shareHubBtn = document.getElementById('shareHubBtn');
      if (shareHubBtn) {
        shareHubBtn.addEventListener('click', function () {
          var url = access.hubUrlWithKey();
          var done = function () {
            shareHubBtn.textContent = 'Copied hub link!';
            setTimeout(function () { shareHubBtn.textContent = 'Copy hub link'; }, 1600);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(done);
          } else {
            window.prompt('Copy this internal hub link:', url);
            done();
          }
        });
      }

      function sharePrototype(btn) {
        var url = btn.getAttribute('data-share-url') || '';
        var title = btn.getAttribute('data-share-title') || 'Prototype';
        var label = btn.querySelector('.share-label');

        function markCopied() {
          btn.classList.add('is-copied');
          if (label) label.textContent = 'Copied!';
          setTimeout(function () {
            btn.classList.remove('is-copied');
            if (label) label.textContent = 'Share';
          }, 1600);
        }

        function copyFallback() {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(url).then(markCopied);
          }
          var input = document.createElement('input');
          input.value = url;
          input.setAttribute('readonly', '');
          input.style.position = 'fixed';
          input.style.opacity = '0';
          document.body.appendChild(input);
          input.select();
          try { document.execCommand('copy'); markCopied(); } catch (err) { window.prompt('Copy this link:', url); }
          input.remove();
          return Promise.resolve();
        }

        if (navigator.share) {
          navigator.share({ title: title, text: 'Have a look at this prototype and leave feedback:', url: url })
            .then(markCopied)
            .catch(function (err) {
              if (err && err.name === 'AbortError') return;
              copyFallback();
            });
          return;
        }
        copyFallback();
      }

      function isGroup(item) {
        return Array.isArray(item.children) && item.children.length > 0;
      }

      // Groups are containers only — feedback stays scoped to each child prototype.
      function prototypesOf(items) {
        return items.reduce(function (all, item) {
          return all.concat(isGroup(item) ? item.children : [item]);
        }, []);
      }

      function metaMarkup(item, extra) {
        var status = (item.status || 'active').toLowerCase();
        var pillClass = status === 'draft' ? 'pill is-draft' : 'pill';
        var updated = item.updated ? ('Updated ' + item.updated) : '';
        return (
          '<div class="meta">' +
            '<span class="' + pillClass + '">' + escapeHtml(status) + '</span>' +
            (extra ? '<span>' + escapeHtml(extra) + '</span>' : '') +
            (updated ? '<span>' + escapeHtml(updated) + '</span>' : '') +
            (item.path ? '<span class="fb-count" data-count-for="' + escapeAttr(item.id) + '">Feedback…</span>' : '') +
          '</div>'
        );
      }

      function absoluteUrl(path) {
        try {
          return new URL(path, location.href).href;
        } catch (e) {
          return location.origin + '/' + String(path || '').replace(/^\//, '');
        }
      }

      function linksMarkup(item) {
        var key = access.configuredKey();
        var feedbackHref = 'feedback.html?id=' + encodeURIComponent(item.id) + (key ? '&key=' + encodeURIComponent(key) : '');
        var shareUrl = absoluteUrl(item.path);
        return (
          '<div class="links">' +
            '<a href="' + escapeAttr(item.path) + '">Open <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>' +
            '<button type="button" class="secondary share-btn" data-share-url="' + escapeAttr(shareUrl) + '" data-share-title="' + escapeAttr(item.title || item.id) + '">' +
              '<i class="fa-solid fa-share-nodes" aria-hidden="true"></i> <span class="share-label">Share</span>' +
            '</button>' +
            '<a class="secondary" href="' + feedbackHref + '"><i class="fa-regular fa-comment-dots" aria-hidden="true"></i> Feedback</a>' +
          '</div>'
        );
      }

      function cardMarkup(item) {
        return (
          '<li class="card" data-prototype-id="' + escapeAttr(item.id) + '">' +
            '<div>' +
              '<h2><a href="' + escapeAttr(item.path) + '">' + escapeHtml(item.title || item.id) + '</a></h2>' +
              '<p>' + escapeHtml(item.description || '') + '</p>' +
              metaMarkup(item) +
            '</div>' +
            linksMarkup(item) +
          '</li>'
        );
      }

      function subMarkup(item) {
        return (
          '<li class="sub" data-prototype-id="' + escapeAttr(item.id) + '">' +
            '<div>' +
              '<h3><a href="' + escapeAttr(item.path) + '">' + escapeHtml(item.title || item.id) + '</a></h3>' +
              '<p>' + escapeHtml(item.description || '') + '</p>' +
              metaMarkup(item) +
            '</div>' +
            linksMarkup(item) +
          '</li>'
        );
      }

      function groupMarkup(group) {
        var n = group.children.length;
        return (
          '<li class="card is-group" data-prototype-group="' + escapeAttr(group.id) + '">' +
            '<div>' +
              '<h2>' + escapeHtml(group.title || group.id) + '</h2>' +
              '<p>' + escapeHtml(group.description || '') + '</p>' +
              metaMarkup(group, n === 1 ? '1 mock' : n + ' mocks') +
            '</div>' +
            '<ul class="subs">' + group.children.map(subMarkup).join('') + '</ul>' +
          '</li>'
        );
      }

      function escapeHtml(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
      function escapeAttr(s) { return escapeHtml(s).replace(/'/g, '&#39;'); }
      function cssEscape(s) {
        if (window.CSS && CSS.escape) return CSS.escape(s);
        return String(s).replace(/"/g, '\\"');
      }
    })();
  </script>
</body>
</html>
