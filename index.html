<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prototypes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      --ink: #1a1d26;
      --muted: #5c6378;
      --line: #e4e6ee;
      --paper: #f7f6f2;
      --panel: #ffffff;
      --accent: #2f5d50;
      --accent-soft: #e8f0ed;
      --warm: #c45c26;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #dde8e4 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #f3e6dc 0%, transparent 50%),
        linear-gradient(180deg, var(--paper) 0%, #efece6 100%);
    }
    .wrap {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0 80px;
    }
    .brand {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(2.4rem, 5vw, 3.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 10px;
      line-height: 1.1;
    }
    .tagline {
      margin: 0 0 36px;
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 36em;
      line-height: 1.5;
    }
    .hint {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin: 0 0 28px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--panel) 85%, transparent);
      font-size: 0.92rem;
      color: var(--muted);
    }
    .hint span { display: inline-flex; align-items: center; gap: 8px; }
    .hint i { color: var(--accent); width: 1em; text-align: center; }

    .list {
      display: grid;
      gap: 12px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px 20px;
      align-items: center;
      padding: 18px 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
      box-shadow: 0 10px 28px rgba(26, 29, 38, 0.08);
      transform: translateY(-1px);
    }
    .card h2 {
      margin: 0 0 4px;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .pill.is-draft {
      background: #f3efe8;
      color: #8a5a2b;
    }
    .open {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
    }
    .empty, .err {
      padding: 28px 20px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }
    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer code {
      font-size: 0.85em;
      background: rgba(255,255,255,0.7);
      padding: 2px 6px;
      border-radius: 4px;
    }
    @media (max-width: 640px) {
      .wrap { width: calc(100% - 28px); padding-top: 36px; }
      .card { grid-template-columns: 1fr; }
      .open { justify-self: start; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="brand" id="siteName">Prototypes</h1>
    <p class="tagline" id="siteTagline">Click a mock, share the link, leave feedback.</p>
    <div class="hint" aria-hidden="false">
      <span><i class="fa-solid fa-link"></i> Share any mock URL</span>
      <span><i class="fa-solid fa-rotate"></i> Push updates — links stay live</span>
      <span><i class="fa-regular fa-comment-dots"></i> Feedback button on every page</span>
    </div>
    <ul class="list" id="mockList" aria-live="polite">
      <li class="empty">Loading mocks…</li>
    </ul>
    <footer>
      Add a file under <code>mocks/</code>, list it in <code>manifest.json</code>, push, done.
    </footer>
  </main>
  <script src="config.js"></script>
  <script>
    (function () {
      var cfg = window.PROTOTYPES_CONFIG || {};
      if (cfg.siteName) {
        document.getElementById('siteName').textContent = cfg.siteName;
        document.title = cfg.siteName;
      }
      if (cfg.siteTagline) {
        document.getElementById('siteTagline').textContent = cfg.siteTagline;
      }

      // Optional Clarity on the hub too
      var clarityId = (cfg.clarityId || '').trim();
      if (clarityId) {
        (function (c, l, a, r, i, t, y) {
          c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
          t = l.createElement(r); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + i;
          y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, 'clarity', 'script', clarityId);
      }

      var list = document.getElementById('mockList');
      fetch('manifest.json', { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('manifest missing');
          return r.json();
        })
        .then(function (items) {
          if (!Array.isArray(items) || !items.length) {
            list.innerHTML = '<li class="empty">No mocks yet. Add one in <code>manifest.json</code>.</li>';
            return;
          }
          list.innerHTML = items.map(function (item) {
            var status = (item.status || 'active').toLowerCase();
            var pillClass = status === 'draft' ? 'pill is-draft' : 'pill';
            var updated = item.updated ? ('Updated ' + item.updated) : '';
            return (
              '<li>' +
                '<a class="card" href="' + escapeAttr(item.path) + '">' +
                  '<div>' +
                    '<h2>' + escapeHtml(item.title || item.id) + '</h2>' +
                    '<p>' + escapeHtml(item.description || '') + '</p>' +
                    '<div class="meta">' +
                      '<span class="' + pillClass + '">' + escapeHtml(status) + '</span>' +
                      (updated ? '<span>' + escapeHtml(updated) + '</span>' : '') +
                    '</div>' +
                  '</div>' +
                  '<span class="open">Open <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span>' +
                '</a>' +
              '</li>'
            );
          }).join('');
        })
        .catch(function () {
          list.innerHTML = '<li class="err">Couldn’t load <code>manifest.json</code>. Serve this folder over HTTP (not as a file:// page).</li>';
        });

      function escapeHtml(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
      function escapeAttr(s) { return escapeHtml(s).replace(/'/g, '&#39;'); }
    })();
  </script>
  <script src="shared/feedback.js" defer></script>
</body>
</html>
