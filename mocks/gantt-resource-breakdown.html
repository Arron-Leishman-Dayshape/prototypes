        bar.addEventListener('click', function (e) {
            e.stopPropagation();
            // A bar click is a single-booking selection, which opens the
            // detail sidebar rather than the multi-select one.
            state.selection = [{ key: 'bar|' + it.id, worker: worker, row: row, week: it.startWeek, items: [it], single: true }];
            state.selectedCell = null;
            render();
        });
        box.appendChild(bar);
    });
    return box;
}

function buildTodayMarker() {
    var diff = Math.round((TODAY - FIRST_MONDAY) / 86400000);
    var wi = Math.floor(diff / 7);
    var di = diff % 7;
    var m = el('div', 'Today');
    m.style.left = (405 + wi * WEEK_W + Math.min(di, 4) * DAY_W + DAY_W / 2) + 'px';
    return m;
}

function isSelected(key) {
    return state.selection.some(function (s) { return s.key === key; });
}

function isItemSelected(item) {
    return state.selection.some(function (s) {
        return s.items.some(function (i) { return i.id === item.id; });
    });
}

// ── Settings menu ──────────────────────────────────────────────────────────
var settingsBtn = document.getElementById('settingsBtn');
settingsBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    state.menu = state.menu ? null : 'root';
    state.flyout = null;
    renderMenu();
});

function renderMenu() {
    var existing = document.getElementById('menuLayer');
    if (existing) existing.remove();
    settingsBtn.classList.toggle('is-active', !!state.menu);
    if (!state.menu) return;

    var layer = el('div', 'MenuLayer');
    layer.id = 'menuLayer';
    layer.addEventListener('click', function () { state.menu = null; state.flyout = null; renderMenu(); });

    var anchor = settingsBtn.getBoundingClientRect();
    var menu = el('div', 'Menu');
    menu.style.left = anchor.left + 'px';
    menu.style.top = (anchor.bottom + 4) + 'px';
    menu.addEventListener('click', function (e) { e.stopPropagation(); });

    // ── Row Layout ────────────────────────────────────────────────────
    var rowLayout = el('div', 'Menu-group');
    rowLayout.appendChild(menuSection('Row Layout', ['Business Unit', 'Location', 'Job Profile']));
    rowLayout.appendChild(staticItem('Resource Data'));
    rowLayout.appendChild(staticItem('Resource Sorting'));

    var bd = null;
    if (breakdownAvailable()) {
        bd = submenuItem('Resource Breakdown', 'breakdown');
        rowLayout.appendChild(bd);
    }
    menu.appendChild(rowLayout);

    // ── Time Settings ─────────────────────────────────────────────────
    var time = el('div', 'Menu-group');
    time.appendChild(menuSection('Time Settings'));
    time.appendChild(staticItem('Gantt Start Date'));
    time.appendChild(staticItem('Visible Time (Auto)'));
    menu.appendChild(time);

    // ── Availability Settings ─────────────────────────────────────────
    var avail = el('div', 'Menu-group');
    avail.appendChild(menuSection('Availability Settings'));
    var sa = el('div', 'Menu-item');
    sa.innerHTML = '<span>Show Availability</span>' + (state.showAvailability ? '<i class="fa-solid fa-check"></i>' : '');
    sa.addEventListener('click', function () { state.showAvailability = !state.showAvailability; renderMenu(); render(); });
    avail.appendChild(sa);

    var av = submenuItem('Availability Settings', 'availability');
    avail.appendChild(av);
    menu.appendChild(avail);

    // ── Other Settings ────────────────────────────────────────────────
    var other = el('div', 'Menu-group');
    other.appendChild(menuSection('Other Settings'));
    other.appendChild(staticItem('Show Draft Bookings'));
    other.appendChild(staticItem('Show Draft Unavailability'));
    other.appendChild(staticItem('Show Debug Labels'));
    menu.appendChild(other);

    // ── Colour Scheme ─────────────────────────────────────────────────
    var colour = el('div', 'Menu-group');
    colour.appendChild(menuSection('Colour Scheme', ['Trait Color', 'Phase Color', 'Engagement Color']));
    menu.appendChild(colour);

    // ── Resource Requirements ─────────────────────────────────────────
    var reqs = el('div', 'Menu-group');
    reqs.appendChild(menuSection('Resource Requirements'));
    reqs.appendChild(staticItem('Suitability Scoring'));
    menu.appendChild(reqs);

    layer.appendChild(menu);

    var flyout = null, flyoutAnchor = null;
    if (state.flyout === 'breakdown' && bd) { flyout = breakdownFlyout(); flyoutAnchor = bd; }
    if (state.flyout === 'availability') { flyout = availabilityFlyout(); flyoutAnchor = av; }
    if (flyout) layer.appendChild(flyout);

    overlays.appendChild(layer);
    // Needs layout, so place the submenu once both panels are in the document.
    if (flyout) placeFlyout(flyout, menu, flyoutAnchor);
}

function menuSection(title, options) {
    var s = el('div', 'Menu-section' + (options ? ' has-select' : ''));
    s.appendChild(el('div', 'Menu-title', title));
    if (options) {
        var sel = el('select', 'Menu-select');
        options.forEach(function (o) { sel.appendChild(new Option(o, o)); });
        s.appendChild(sel);
    }
    return s;
}

function staticItem(label) {
    var n = el('div', 'Menu-item is-static');
    n.appendChild(el('span', null, label));
    return n;
}

function submenuItem(label, flyout) {
    var n = el('div', 'Menu-item' + (state.flyout === flyout ? ' is-open' : ''));
    n.innerHTML = '<span>' + esc(label) + '</span><i class="fa-solid fa-chevron-left"></i>';
    n.addEventListener('mouseenter', function () { state.flyout = flyout; renderMenu(); });
    return n;
}

// Submenus sit flush against the menu's right edge with their top on the
// anchor row, so the two panels read as one surface.
function placeFlyout(f, menu, anchorEl) {
    var a = anchorEl.getBoundingClientRect();
    f.style.left = (parseFloat(menu.style.left) + MENU_W - 1) + 'px';
    f.style.top = Math.max(8, Math.min(a.top, window.innerHeight - f.offsetHeight - 8)) + 'px';
}

// MVP is a single-select None / Role (DEVO-29670). The other dimensions are
// aggregated for later phases but are not exposed in the menu yet.
var BREAKDOWN_OPTIONS = ['none', 'role'];

function breakdownFlyout() {
    var f = el('div', 'Flyout');
    f.addEventListener('click', function (e) { e.stopPropagation(); });
    f.appendChild(el('div', 'Flyout-title', 'Resource Breakdown'));

    BREAKDOWN_OPTIONS.forEach(function (key) {
        var r = el('div', 'Radio' + (state.breakdown === key ? ' is-checked' : ''));
        r.appendChild(el('div', 'Radio-dot'));
        r.appendChild(el('span', null, DIMENSIONS[key].label));
        r.addEventListener('click', function () {
            setBreakdown(key);
            state.menu = null; state.flyout = null;
            renderMenu(); render();
        });
        f.appendChild(r);
    });

    return f;
}

function availabilityFlyout() {
    var locked = breakdownOn();
    var f = el('div', 'Flyout');
    f.addEventListener('click', function (e) { e.stopPropagation(); });
    f.appendChild(el('div', 'Flyout-title', 'Availability Display Settings'));

    // Slim/Full stay visible while a breakdown is active, but locked to Slim.
    [[true, 'Display Slim View'], [false, 'Display Full View']].forEach(function (v) {
        var r = el('div', 'Radio' + (state.slimView === v[0] ? ' is-checked' : '') + (locked ? ' is-disabled' : ''));
        r.appendChild(el('div', 'Radio-dot'));
        r.appendChild(el('span', null, v[1]));
        if (!locked) {
            r.addEventListener('click', function () { state.slimView = v[0]; renderMenu(); render(); });
        }
        f.appendChild(r);
    });

    // By Day cannot represent an aggregated week, so it drops out during
    // breakdown; By Week and By Month stay selectable.
    var seg = el('div', 'Seg');
    [['day', 'By Day'], ['week', 'By Week'], ['month', 'By Month']].forEach(function (g) {
        var off = locked && g[0] === 'day';
        var b = el('button', state.grouping === g[0] ? 'is-active' : '', g[1]);
        b.disabled = off;
        if (!off) b.addEventListener('click', function () { state.grouping = g[0]; renderMenu(); render(); });
        seg.appendChild(b);
    });
    f.appendChild(seg);

    var hrs = el('div', 'Seg');
    [['consumed', 'Consumed hours'], ['available', 'Available hours']].forEach(function (h) {
        var b = el('button', state.hoursMode === h[0] ? 'is-active' : '', h[1]);
        b.disabled = locked;
        if (!locked) b.addEventListener('click', function () { state.hoursMode = h[0]; renderMenu(); render(); });
        hrs.appendChild(b);
    });
    f.appendChild(hrs);

    f.appendChild(el('div', 'Flyout-title', 'Availability Colour Settings'));
    var grey = el('div', 'Checkbox' + (state.tasksInGrey ? ' is-checked' : ''));
    var box = el('div', 'Checkbox-box');
    box.innerHTML = '<i class="fa-solid fa-check"></i>';
    grey.appendChild(box);
    grey.appendChild(el('span', null, 'Display tasks in grey'));
    grey.addEventListener('click', function () { state.tasksInGrey = !state.tasksInGrey; renderMenu(); render(); });
    f.appendChild(grey);

    return f;
}

document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
        if (document.getElementById('modalLayer')) { closeModal(); return; }
        if (state.menu) { state.menu = null; state.flyout = null; renderMenu(); return; }
        if (state.selection.length) { state.selection = []; render(); }
    }
});

// ── Selection sidebar ──────────────────────────────────────────────────────
// Mirrors booking-sidebar.tsx from the Figma Make prototype. One builder, two
// modes: a single booking shows its job context and phases; a multi-job
// selection blanks the values to "--" and hides Phases (the prototype's
// "noJobContext" dash mode).
function clearSelection() { state.selection = []; state.selectedCell = null; render(); }

function panelBtn(icon, opts) {
    opts = opts || {};
    var b = el('button', 'PanelBtn' + (opts.cls ? ' ' + opts.cls : '') + (opts.active ? ' is-active' : ''));
    b.type = 'button';
    b.innerHTML = '<i class="' + icon + '"></i>' + (opts.caret ? '<i class="fa-solid fa-caret-down"></i>' : '');
    if (opts.caret) b.classList.add('PanelBtn--wide');
    if (opts.label) { b.setAttribute('aria-label', opts.label); b.title = opts.label; }
    if (opts.onClick) b.addEventListener('click', function (e) { e.stopPropagation(); opts.onClick(e); });
    return b;
}

// A "Sidebar section header": chevron, bold label, muted suffix, action buttons,
// and an optional body that the chevron toggles.
function panelSection(opts) {
    var wrap = el('div', 'Panel-section' + (opts.open ? ' is-open' : ''));
    var head = el('div', 'Panel-sectionHead');

    var label = el('div', 'Panel-sectionLabel');
    var chev = el('div', 'Panel-chev');
    chev.innerHTML = '<i class="fa-solid fa-chevron-down"></i>';
    label.appendChild(chev);

    var text = el('div', 'Panel-sectionText');
    text.appendChild(el('b', null, opts.title));
    if (opts.suffix) text.appendChild(el('span', 'muted', opts.suffix));
    if (opts.link) text.appendChild(el('span', 'link', opts.link));
    if (opts.pill) text.appendChild(el('span', 'Panel-pill', opts.pill));
    label.appendChild(text);
    head.appendChild(label);

    if (opts.buttons && opts.buttons.length) {
        var btns = el('div', 'Panel-sectionBtns');
        opts.buttons.forEach(function (b) { btns.appendChild(b); });
        head.appendChild(btns);
    }
    wrap.appendChild(head);

    var body = null;
    if (opts.body) {
        body = el('div', 'Panel-sectionBody');
        body.appendChild(opts.body);
        if (!opts.open) body.style.display = 'none';
        wrap.appendChild(body);
    }
    function toggle() {
        var open = wrap.classList.toggle('is-open');
        if (body) body.style.display = open ? '' : 'none';
    }
    chev.addEventListener('click', toggle);
    text.addEventListener('click', toggle);
    return wrap;
}

function panelField(icon, build) {
    var f = el('div', 'Panel-field');
    f.innerHTML = '<i class="lead ' + icon + '"></i>';
    var body = el('div', 'Panel-fieldBody');
    build(body);
    f.appendChild(body);
    return f;
}

function effortInput(value, unit) {
    var e = el('div', 'Panel-effort');
    e.appendChild(el('div', 'val', value));
    e.appendChild(el('div', 'unit', unit));
    return e;
}

function fmtStamp(d, time) {
    return time + ' ' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()) + '/' + String(d.getFullYear()).slice(-2);
}

function initials(name) {
    return name.split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('');
}

function renderPanel() {
    var old = document.getElementById('selPanel');
    if (old) old.remove();
    if (!state.selection.length) return;

    var all = [];
    state.selection.forEach(function (s) { s.items.forEach(function (it) { if (all.indexOf(it) === -1) all.push(it); }); });
    if (!all.length) return;

    var sel = state.selection[0];
    var worker = sel.worker;
    var lead = all[0];
    // Dash mode: a multi-booking selection can span engagements, so every
    // job-specific value blanks out to "--".
    var dash = all.length > 1 || !lead.code;

    var p = el('div', 'Panel');
    p.id = 'selPanel';
    p.appendChild(panelHead(lead, all, dash));
    p.appendChild(panelBody(lead, worker, dash));
    overlays.appendChild(p);
}

function panelHead(lead, all, dash) {
    var head = el('div', 'Panel-head');

    if (!dash) {
        var group = el('div');
        group.style.display = 'flex';
        group.style.flexDirection = 'column';

        var top = el('div', 'Panel-headTop');
        top.appendChild(el('p', 'Panel-title', lead.job));
        top.appendChild(panelBtn('fa-solid fa-xmark', { cls: 'PanelBtn--close', label: 'Close', onClick: clearSelection }));
        group.appendChild(top);

        if (lead.code) {
            var meta = el('div', 'Panel-meta');
            var pri = el('div', 'Panel-priority');
            pri.innerHTML = '<i class="fa-solid fa-angles-up"></i>';
            meta.appendChild(pri);
            meta.appendChild(el('div', 'Panel-code', lead.code));
            group.appendChild(meta);
        }
        head.appendChild(group);
    }

    var bar = el('div', 'Panel-toolbar');
    bar.appendChild(!dash && lead.phase ? el('div', 'Panel-badge', lead.phase) : el('div'));

    var tools = el('div', 'Panel-tools');
    tools.appendChild(panelBtn('fa-regular fa-clone', { label: 'Clone' }));
    tools.appendChild(panelBtn('fa-regular fa-trash-can', { label: 'Delete' }));
    tools.appendChild(panelBtn('fa-solid fa-crosshairs', { label: 'Jump to' }));
    tools.appendChild(panelBtn('fa-solid fa-clock-rotate-left', { label: 'Audit history' }));
    tools.appendChild(panelBtn('fa-solid fa-retweet', { label: 'Swap / reassign' }));
    if (dash) tools.appendChild(panelBtn('fa-solid fa-xmark', { cls: 'PanelBtn--close', label: 'Close', onClick: clearSelection }));
    bar.appendChild(tools);
    head.appendChild(bar);

    if (all.length > 1) {
        var count = el('div', 'Panel-count');
        count.appendChild(el('span', null, all.length + ' Selected Booking' + (all.length === 1 ? '' : 's')));
        var x = el('button', 'Panel-countX');
        x.type = 'button';
        x.title = 'Clear selection';
        x.innerHTML = '<i class="fa-solid fa-xmark"></i>';
        x.addEventListener('click', clearSelection);
        count.appendChild(x);
        head.appendChild(count);
    }
    return head;
}

function panelBody(lead, worker, dash) {
    var body = el('div', 'Panel-body');
    body.appendChild(scheduleBlock(lead, worker, dash));

    body.appendChild(panelSection({ title: 'Suggestions', suffix: '(0)' }));
    body.appendChild(panelSection({
        title: 'Resource Requirements',
        buttons: [panelBtn('fa-solid fa-filter', { label: 'Filter' })]
    }));
    body.appendChild(panelSection({
        title: 'Traits', suffix: '(Detail)',
        buttons: [panelBtn('fa-solid fa-pencil', { label: 'Edit' })]
    }));
    body.appendChild(panelSection({ title: 'Booking State', suffix: '(Definite)' }));
    body.appendChild(panelSection({
        title: 'Engagement',
        link: dash ? null : lead.code,
        buttons: [panelBtn('fa-regular fa-calendar-plus', { label: 'Calendar' }),
                  panelBtn('fa-solid fa-right-left', { label: 'Swap' }),
                  panelBtn('fa-solid fa-filter', { label: 'Filter' })]
    }));

    if (!dash) body.appendChild(phasesSection(lead, worker));

    body.appendChild(panelSection({ title: 'Economics', suffix: '(Recovery Rate 74%, Margin 56%)' }));
    body.appendChild(panelSection({ title: 'Percentage Scheduled', suffix: '(72.9%)' }));
    body.appendChild(panelSection({ title: 'Location' }));
    body.appendChild(panelSection({ title: 'Notes' }));
    return body;
}

function scheduleBlock(lead, worker, dash) {
    var wrap = el('div', 'Panel-schedule');
    wrap.appendChild(el('div', 'Panel-scheduleTitle', 'Schedule'));

    var start = WEEKS[lead.startWeek];
    var endMonday = WEEKS[Math.min(lead.startWeek + lead.span - 1, WEEKS.length - 1)];
    var end = new Date(endMonday.getFullYear(), endMonday.getMonth(), endMonday.getDate() + 4);
    var total = 0;
    Object.keys(lead.cells).forEach(function (k) { total += lead.cells[k]; });

    var fields = el('div', 'Panel-fields');

    fields.appendChild(panelField('fa-regular fa-clock', function (f) {
        f.appendChild(el('div', 'Panel-input' + (dash ? ' is-dash' : ''), dash ? '--' : fmtStamp(start, '09:00AM')));
        var lock = el('div', 'Panel-lock');
        lock.innerHTML = '<i class="fa-solid fa-lock-open"></i>';
        f.appendChild(lock);
        f.appendChild(el('div', 'Panel-input' + (dash ? ' is-dash' : ''), dash ? '--' : fmtStamp(end, '05:30PM')));
    }));

    var person = panelField('fa-solid fa-user', function (f) {
        f.appendChild(el('span', 'Panel-person', dash ? '--' : '(' + worker.grade + ') ' + worker.name));
    });
    person.classList.add('Panel-effortRow');
    fields.appendChild(person);

    fields.appendChild(panelField('fa-solid fa-hourglass-half', function (f) {
        if (dash) {
            f.appendChild(effortInput('--', 'h'));
            f.appendChild(effortInput('--', 'm'));
        } else {
            f.appendChild(effortInput(String(Math.floor(total)), 'h'));
            f.appendChild(effortInput(String(Math.round((total % 1) * 60)), 'm'));
            f.appendChild(effortInput('30', '%'));
        }
    }));
    wrap.appendChild(fields);

    var actions = el('div', 'Panel-actions');
    actions.appendChild(panelBtn('fa-solid fa-up-down-left-right', { caret: true, label: 'Move' }));
    var split = el('div', 'Panel-split');
    split.appendChild(panelBtn('fa-regular fa-calendar-days', { label: 'Reschedule' }));
    split.appendChild(panelBtn('fa-solid fa-caret-down', { label: 'Reschedule options' }));
    actions.appendChild(split);
    actions.appendChild(panelBtn('fa-solid fa-down-left-and-up-right-to-center', { label: 'Compress' }));
    wrap.appendChild(actions);
    return wrap;
}

function phasesSection(lead, worker) {
    var total = 0;
    Object.keys(lead.cells).forEach(function (k) { total += lead.cells[k]; });

    var table = el('div', 'PhaseTable');
    var head = el('div', 'PhaseTable-row PhaseTable-head');
    head.appendChild(el('div', 'PhaseTable-cell PhaseTable-cell--phase', 'Phase'));
    head.appendChild(el('div', 'PhaseTable-cell PhaseTable-cell--other', 'Assignee'));
    head.appendChild(el('div', 'PhaseTable-cell PhaseTable-cell--other', 'Status'));
    table.appendChild(head);

    PHASE_ORDER.forEach(function (phase) {
        var assigned = phase === lead.phase;
        var row = el('div', 'PhaseTable-row is-clickable');

        var name = el('div', 'PhaseTable-cell PhaseTable-cell--phase');
        name.appendChild(el('span', 'PhaseTable-name', phase));
        var tick = el('i', 'PhaseTable-tick fa-solid fa-check');
        tick.style.display = 'none';
        name.appendChild(tick);
        row.appendChild(name);

        var who = el('div', 'PhaseTable-cell PhaseTable-cell--other');
        var stack = el('div', 'AvatarStack');
        if (assigned) {
            stack.appendChild(el('div', 'Avatar', initials(worker.name)));
        } else {
            var empty = el('div', 'Avatar Avatar--empty');
            empty.innerHTML = '<i class="fa-solid fa-user"></i>';
            stack.appendChild(empty);
        }
        who.appendChild(stack);
        row.appendChild(who);

        // Preparation (or any assigned phase) reads as done, First Review as
        // in-progress, anything else as not started.
        var kind = (phase === 'Preparation' || assigned) ? 'done' : phase === 'First Review' ? 'progress' : 'idle';
        var st = el('div', 'PhaseTable-cell PhaseTable-cell--other');
        var dot = el('div', 'PhaseStatus' + (kind === 'done' ? '' : ' PhaseStatus--' + kind));
        dot.innerHTML = '<i class="fa-solid ' + (kind === 'done' ? 'fa-user-check' : kind === 'progress' ? 'fa-retweet' : 'fa-arrow-right') + '"></i>';
        st.appendChild(dot);
        row.appendChild(st);

        row.addEventListener('click', function () {
            var on = row.classList.toggle('is-selected');
            [].forEach.call(table.querySelectorAll('.PhaseTable-row'), function (r) {
                if (r !== row) r.classList.remove('is-selected');
                var t = r.querySelector('.PhaseTable-tick');
                if (t) t.style.display = 'none';
            });
            tick.style.display = on ? '' : 'none';
        });
        table.appendChild(row);
    });

    return panelSection({
        title: 'Phases', suffix: '(' + PHASE_ORDER.length + ')',
        pill: (Math.round(total * 10) / 10) + ' hours',
        open: true, body: table,
        buttons: [panelBtn('fa-regular fa-calendar-plus', { label: 'Select all phase bookings' }),
                  panelBtn('fa-solid fa-filter', { label: 'Filter to phase bookings' })]
    });
}

                '<div class="CreateBooking-field">' +
                    '<div class="CreateBooking-label">From <span class="Modal-req">*</span></div>' +
                    '<div class="CreateBooking-inputGroup"><input type="text" value="' + from + '" />' +
                    '<button type="button" class="CreateBooking-unit" aria-label="Pick from date">' +
                    '<i class="fa-regular fa-calendar"></i></button></div>' +
                '</div>' +
                '<div class="CreateBooking-field">' +
                    '<div class="CreateBooking-label">To <span class="Modal-req">*</span></div>' +
                    '<div class="CreateBooking-inputGroup"><input type="text" placeholder="Select date and time" />' +
                    '<button type="button" class="CreateBooking-unit" aria-label="Pick to date">' +
                    '<i class="fa-regular fa-calendar"></i></button></div>' +
                '</div>' +
            '</div>' +
            '<div class="CreateBooking-field">' +
                '<div class="CreateBooking-label">Effort <span class="Modal-req">*</span></div>' +
                '<div class="CreateBooking-effortRow">' +
                    '<div class="CreateBooking-effortInputs">' +
                        '<div class="CreateBooking-inputGroup"><input type="number" min="0" step="1" value="30" aria-label="Hours" />' +
                        '<span class="CreateBooking-unit" aria-hidden="true">h</span></div>' +
                        '<div class="CreateBooking-inputGroup"><input type="number" min="0" max="45" step="15" value="0" aria-label="Minutes" />' +
                        '<span class="CreateBooking-unit" aria-hidden="true">m</span></div>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div class="CreateBooking-field">' +
                '<div class="CreateBooking-label">Assigned Resource</div>' +
                '<div class="CreateBooking-assigned">' +
                    '<span class="CreateBooking-assignedText">(' + esc(worker.grade) + ') ' + esc(worker.name) + '</span>' +
                    '<i class="fa-solid fa-circle-check CreateBooking-assignedOk" aria-hidden="true"></i>' +
                    '<span class="CreateBooking-unit CreateBooking-unit--icon" aria-hidden="true"><i class="fa-solid fa-user"></i></span>' +
                '</div>' +
            '</div>' +
        '</div>';

    if ((dim === 'role' || dim === 'req') && value) {
        var grade = '', unit = '', location = '', engRole = '';
        if (dim === 'role') {
            engRole = value;
        } else {
            var parts = value.split(' / ');
            grade = parts[0] || ''; unit = parts[1] || ''; location = parts[2] || '';
        }
        html +=
            '<div class="CreateBooking-stack">' +
                '<hr class="CreateBooking-divider" />' +
                '<h3 class="CreateBooking-sectionTitle">Resource Requirement</h3>' +
                '<div class="BtnGroup" role="group" aria-label="Requirement type">' +
                    '<button type="button">Specific</button>' +
                    '<button type="button" class="is-active">Flexible</button>' +
                '</div>' +
                '<div class="CreateBooking-grid2">' +
                    requirementField('Job Profile', grade, 'fa-solid fa-id-badge') +
                    requirementField('Engagement Role', engRole, 'fa-solid fa-sitemap') +
                '</div>' +
                '<div class="CreateBooking-grid2">' +
                    requirementField('Location', location, 'fa-solid fa-location-dot') +
                    requirementField('Business Unit', unit, 'fa-solid fa-building') +
                '</div>' +
            '</div>';
    }

    html +=
        '<div class="CreateBooking-stack">' +
            '<hr class="CreateBooking-divider" />' +
            '<h3 class="CreateBooking-sectionTitle">Booking Traits</h3>' +
            '<button type="button" class="CreateBooking-addTraitBtn">' +
                '<i class="fas fa-plus" aria-hidden="true"></i>Add Traits</button>' +
            '<div class="CreateBooking-traitsTableWrap">' +
                '<table class="CreateBooking-traitsTable" aria-label="Booking traits">' +
                    '<thead><tr>' +
                        '<th scope="col"><div class="CreateBooking-headerCellContent">' +
                            '<i class="CreateBooking-sortIcon fas fa-sort" aria-hidden="true"></i><span>Name</span></div></th>' +
                        '<th scope="col" class="is-primary"><div class="CreateBooking-headerCellContent">' +
                            '<i class="CreateBooking-sortIcon fas fa-sort" aria-hidden="true"></i><span>Primary</span></div></th>' +
                        '<th scope="col" class="is-actions">Remove</th>' +
                    '</tr></thead>' +
                    (dim === 'bookingType' && value
                        ? '<tbody><tr><td>' + esc(value) + '</td>' +
                          '<td><i class="fa-solid fa-circle-check" style="color:var(--text-success)" aria-label="Primary"></i></td>' +
                          '<td><button type="button" class="CreateBooking-traitRemove" aria-label="Remove trait">' +
                          '<i class="fa-solid fa-xmark"></i></button></td></tr></tbody>'
                        : '<tbody></tbody>') +
                '</table>' +
                (dim === 'bookingType' && value ? '' : '<div class="CreateBooking-traitsEmpty">Nothing to display</div>') +
            '</div>' +
        '</div>';

    var noteText;
    if (row.isOther) {
        noteText = 'Opened from the <strong>Other</strong> row, so no ' + esc(DIMENSIONS[dim].label.toLowerCase()) +
                   ' is inferred — the practitioner picks the value.';
    } else if (dim === 'none') {
        noteText = 'No breakdown is active, so nothing beyond the resource and date is pre-filled.';
    } else {
        noteText = 'Pre-filled <strong>' + esc(DIMENSIONS[dim].label) + ' = ' + esc(value) + '</strong> from the row you opened, ' +
                   'plus the resource and the week you double-clicked.';
    }
    var note = el('div', 'Note');
    note.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i><span>' + noteText + '</span>';

    body.innerHTML = html;
    body.appendChild(note);
    m.appendChild(body);

    var foot = el('div', 'Modal-foot');
    var more = el('button', 'Btn', 'More Options');
    var cancel = el('button', 'Btn Btn--secondary', 'Cancel');
    var create = el('button', 'Btn Btn--primary', 'Save');
    cancel.addEventListener('click', closeModal);
    create.addEventListener('click', function () {
        closeModal();
        toast('Booking created' + (value ? ' — ' + DIMENSIONS[dim].label + ': ' + value : ''));
    });
    foot.appendChild(more); foot.appendChild(cancel); foot.appendChild(create);
    m.appendChild(foot);

    layer.appendChild(m);
    overlays.appendChild(layer);
}

function closeModal() {
    var l = document.getElementById('modalLayer');
    if (l) l.remove();
}

function toast(msg) {
    var t = el('div', 'Toast', msg);
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
}

// ── Boot ───────────────────────────────────────────────────────────────────
document.getElementById('gantt').addEventListener('click', function (e) {
    if (e.target.closest('.Cellw') || e.target.closest('.Bar')) return;
    if (state.selection.length) { state.selection = []; render(); }
});

document.getElementById('gantt').addEventListener('scroll', syncHeadScroll, { passive: true });

// Open on the Role breakdown when it is available, so the prototype lands on
// the state under review. Goes through setBreakdown so the display-setting
// locks and the parked preferences behave exactly as they do at runtime.
if (breakdownAvailable()) setBreakdown('role');

render();
})();
</script>

<script src="../config.js"></script>
<script src="../shared/access.js"></script>
<script src="../shared/feedback-store.js"></script>
<script src="../shared/telemetry-store.js"></script>
<script src="../shared/telemetry.js" defer></script>
<script src="../shared/feedback.js" defer></script>
</body>
</html>
